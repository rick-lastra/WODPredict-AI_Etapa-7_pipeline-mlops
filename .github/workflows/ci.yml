# =============================================================================
# CI · Integración continua: calidad de código, pruebas de datos y de modelo, quality gate e imagen
# =============================================================================
# Corre en cada push y en cada Pull Request hacia main. Si un job falla, el PR no se puede fusionar
# (activar "Require status checks to pass" en Settings > Branches > main).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad-codigo:
    name: 1 · Calidad de código (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.14.5
      - run: ruff check .

  pipeline-modelo:
    name: 2 · Datos, pruebas, entrenamiento y quality gate
    runs-on: ubuntu-latest
    needs: calidad-codigo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Champion vigente = modelo/metadata.json de main (para la regla de no regresión)
        run: |
          git show origin/main:modelo/metadata.json > "$RUNNER_TEMP/champion.json" 2>/dev/null || echo "{}" > "$RUNNER_TEMP/champion.json"
          echo "CHAMPION_METADATA=$RUNNER_TEMP/champion.json" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Caché de datos versionados (clave = SHA-256 de params.yaml)
        uses: actions/cache@v4
        with:
          path: datos/
          key: datos-${{ hashFiles('params.yaml') }}
      - name: Descargar y verificar datos (SHA-256)
        run: python -m pipeline.datos

      - name: Pruebas automatizadas (código, datos, modelo y API)
        run: pytest -v

      - name: Pipeline completo sin promover (valida datos, entrena, ONNX, quality gate, MLflow)
        run: python -m pipeline.ejecutar --sin-promover

      - name: Verificar que modelo/ se reproduce desde params.yaml + datos (GitOps)
        run: python -m pipeline.verificar_reproducibilidad

      - name: Guardar evidencias (reportes y registro de MLflow)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-pipeline-${{ github.sha }}
          path: |
            reportes/
            mlflow.db
            mlruns/
          retention-days: 30

  imagen:
    name: 3 · Imagen Docker y prueba de humo
    runs-on: ubuntu-latest
    needs: pipeline-modelo
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('modelo/metadata.json'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker build --build-arg GIT_COMMIT=${{ github.sha }} --build-arg MODEL_VERSION=$VERSION -t wodpredict-api:ci .
      - name: Levantar contenedor
        run: docker run -d --name wodpredict -p 8000:8000 wodpredict-api:ci
      - name: Prueba de humo contra el contenedor
        run: python3 scripts/smoke_test.py http://localhost:8000 --version-esperada "$VERSION" --p95-max-ms 300
      - name: Logs del contenedor
        if: always()
        run: docker logs wodpredict | tail -n 30
